<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Template</title>
    <link rel="stylesheet" href="./css/style.css" />
    <!-- <link rel="stylesheet" href="./css/responsive.css" /> -->
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <img
          src="./images/logo.png"
          alt="Bankist logo"
          class="nav__logo"
          id="logo"
        />
        <ul class="nav__links">
          <li class="nav__item"><a href="#" class="nav__link">Features</a></li>
          <li class="nav__item">
            <a href="#" class="nav__link">Operations</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link">Testimonials</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link">Open Account</a>
          </li>
        </ul>
      </nav>

      <h1>
        When
        <!-- Green highlight effect -->
        <span class="highlight">banking</span>
        meets<br />
        <span class="highlight">minimalist</span>
      </h1>
    </header>
    <section class="section">
      <h1>Slider Exercise</h1>
      <div class="slider">
        <div class="slide"><img src="images/img-1.jpg" alt="Photo 1" /></div>
        <div class="slide"><img src="images/img-2.jpg" alt="Photo 2" /></div>
        <div class="slide"><img src="images/img-3.jpg" alt="Photo 3" /></div>
        <div class="slide"><img src="images/img-4.jpg" alt="Photo 4" /></div>
        <button class="slider__btn slider__btn--left">&larr;</button>
        <button class="slider__btn slider__btn--right">&rarr;</button>
        <div class="dots"></div>
      </div>
    </section>

    <script src="./js/script.js"></script>
  </body>
</html>
